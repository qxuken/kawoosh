# alacritty_terminal 0.26.0 as published, but for one change: on wasm32
# the pty (`tty`) and its reader (`event_loop`) are left out, and `polling`
# and `home` with them — neither builds there, and kawoosh-term uses only
# the emulator (web/README.md). Patched in for every target by the
# workspace manifest, so a native build is alacritty_terminal's own.

[package]
edition = "2024"
rust-version = "1.85.0"
name = "alacritty_terminal"
version = "0.26.0"
authors = [
    "Christian Duerr <contact@christianduerr.com>",
    "Joe Wilm <joe@jwilm.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Library for writing terminal emulators"
homepage = "https://alacritty.org"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/alacritty/alacritty"
resolver = "2"

[features]
default = ["serde"]
serde = [
    "dep:serde",
    "bitflags/serde",
    "vte/serde",
]

[lib]
name = "alacritty_terminal"
path = "src/lib.rs"

[dependencies.base64]
version = "0.22.0"

[dependencies.bitflags]
version = "2.4.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.home]
version = "0.5.5"

[dependencies.libc]
version = "0.2"

[dependencies.log]
version = "0.4"

[dependencies.parking_lot]
version = "0.12.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.polling]
version = "3.8.0"

[dependencies.regex-automata]
version = "0.4.3"

[dependencies.serde]
version = "1"
features = [
    "derive",
    "rc",
]
optional = true

[dependencies.unicode-width]
version = "0.2.0"

[dependencies.vte]
version = "0.15.0"
features = [
    "std",
    "ansi",
]
default-features = false

[target."cfg(unix)".dependencies.rustix]
version = "1.0.0"
features = ["std"]
default-features = false

[target."cfg(unix)".dependencies.rustix-openpty]
version = "0.2.0"

[target."cfg(unix)".dependencies.signal-hook]
version = "0.4.3"

[target."cfg(windows)".dependencies.miow]
version = "0.6.0"

[target."cfg(windows)".dependencies.piper]
version = "0.2.1"

[target."cfg(windows)".dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
]
