# drydock9, the Forgejo cargo registry kui publishes to
# (docs/design/kui-requirements.md R1.1). Needed to resolve
# `kui-native = { version = "...", registry = "drydock9" }`. kui's own
# manifests still name it `forgejo`, so taking the three crates by path needs
# that name too (a `[registries.forgejo]` with this index, e.g. in
# ~/.cargo/config.toml) until kui renames it.
[registries.drydock9]
index = "sparse+https://drydock9.qxuken.dev/api/packages/qxuken/cargo/"
