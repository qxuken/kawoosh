[package]
name = "kawoosh-term"
publish.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# For `Cell` / `CellGrid` only: kui-core is the data contract, not the
# runner (docs/design/kui-requirements.md R1.4).
kui-core.workspace = true
alacritty_terminal.workspace = true
portable-pty.workspace = true
anyhow.workspace = true
log.workspace = true
# Kitty's graphics protocol (`graphics.rs`): base64 payloads, zlib, PNG.
base64 = "0.23"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
