[package]
name = "kawoosh-doc"
publish.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
text-buffer.workspace = true
slotmap.workspace = true
unicode-segmentation.workspace = true
imara-diff = "0.2"

# `fsync` itself on macOS, where std's sync is `F_FULLFSYNC` alone.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A file's link count and owner (`durable::kept_in_place`): std's
# `number_of_links` is unstable.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
