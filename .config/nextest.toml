# cargo-nextest (https://nexte.st): every test of every binary on one
# pool, a process each, where `cargo test` runs the binaries one after
# another. `scripts/verify.nu` uses it when it is installed. There are
# no doctests in the workspace, which nextest does not run.

[profile.default]
# A test past a minute is named every minute; past five, ended: a hang
# fails the run rather than stalling it.
slow-timeout = { period = "60s", terminate-after = 5 }
# A flaky test fails the run, to be found and fixed, not retried.
retries = 0
fail-fast = false
# The failures again at the end, where they are read.
final-status-level = "fail"
