[package]
name = "kawoosh"
publish.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "kawoosh"

[dependencies]
text-buffer.workspace = true
kawoosh-doc.workspace = true
kawoosh-editor.workspace = true
kawoosh-term.workspace = true
kawoosh-systems.workspace = true
kawoosh-languages.workspace = true
tree-sitter.workspace = true
crossbeam-channel.workspace = true
kawoosh-lua.workspace = true
kui-lua.workspace = true
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
kui.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
anyhow.workspace = true
log.workspace = true
smallvec.workspace = true
libc = "0.2"
blake3.workspace = true
globset = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
# The process's memory for the perf tab (`perf::read_mem`).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# A terminal's `$EDITOR` (src/bin/edit.rs), shipped beside `kawoosh`.
[[bin]]
name = "kawoosh-edit"
path = "src/bin/edit.rs"

[[bin]]
name = "kawoosh-gen"
path = "src/bin/gen.rs"

[dev-dependencies]
criterion.workspace = true
rusqlite.workspace = true

[[bench]]
name = "logger"
harness = false
