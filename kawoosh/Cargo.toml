[package]
name = "kawoosh"
publish.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "kawoosh"

[dependencies]
text-buffer.workspace = true
qdot.workspace = true
kawoosh-doc.workspace = true
kawoosh-editor.workspace = true
kawoosh-term.workspace = true
kawoosh-systems.workspace = true
kawoosh-languages.workspace = true
tree-sitter.workspace = true
# A settings file edited where a key is (settings_edit.rs).
tree-sitter-lua.workspace = true
crossbeam-channel.workspace = true
kawoosh-lua.workspace = true
kui-lua.workspace = true
# A native extension that draws is a kui extension (`CExtension`),
# added to the frame by the shell (docs/design/native.md Decision 4).
kui-ffi.workspace = true
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
kui-native.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
anyhow.workspace = true
log.workspace = true
smallvec.workspace = true
libc = "0.2"
blake3.workspace = true
globset = "0.4"
regex = "1"

[target.'cfg(windows)'.dependencies]
# The process's memory for the perf tab (`perf::read_mem`); the parent's
# console for the CLI half of a GUI program (`main.rs`); `ShellExecuteW`
# for a URL opened in the OS (`links::open_in_os`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The window's icon on X11 (`main.rs`, `window_icon`): the PNG rendered
# from `assets/icons/kawoosh-icon.svg`, decoded to the RGBA kui takes.
# Windows passes the linked resource and macOS has no window icon.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
png = "0.18"
base64 = "0.23"

# A terminal's `$EDITOR` (src/bin/edit.rs), shipped beside `kawoosh`.
[[bin]]
name = "kawoosh-edit"
path = "src/bin/edit.rs"

# What `:relaunch` puts a new Kawoosh in place with on Windows, where
# one waits beside the folder in use (src/update.rs), shipped beside
# `kawoosh` there.
[[bin]]
name = "kawoosh-update"
path = "src/bin/update.rs"

[[bin]]
name = "kawoosh-gen"
path = "src/bin/gen.rs"

[dev-dependencies]
png = "0.18"
# The pictures `tests/image.rs` draws: in the tree through the systems.
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
base64 = "0.23"
criterion.workspace = true
rusqlite.workspace = true

[[bench]]
name = "logger"
harness = false

# kawoosh.exe's icon (build.rs): rc.exe on Windows, llvm-rc for a build
# from another host. serde_json reads `cargo metadata` for kui's header,
# whose `kui_*` the exe exports on Windows (build.rs, `export_def`).
[build-dependencies]
embed-resource = "3"
serde_json.workspace = true
