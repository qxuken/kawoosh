[workspace]
resolver = "3"
members = ["core", "kawoosh", "resources", "text-buffer"]

[workspace.package]
publish = false
version = "0.0.1"
edition = "2024"
authors = ["Nasonov Viktor <me@qxuken.dev>"]
repository = "https://drydock9.qxuken.dev/qxuken/kawoosh"

[workspace.dependencies]
text-buffer = { path = "./text-buffer" }
resources = { path = "./resources" }

log = { version = "0.4.33", features = ["serde"] }
env_logger = "0.11.11"

gpui = { git = "https://drydock9.qxuken.dev/mirrors/zed.git", rev = "c399451ca019f1df10782cebb1a3e3e662195fcd" }
gpui_platform = { git = "https://drydock9.qxuken.dev/mirrors/zed.git", rev = "c399451ca019f1df10782cebb1a3e3e662195fcd", features = [
    "font-kit",
    "wayland",
    "x11",
] }
anyhow = { version = "1.0.104", features = ["backtrace"] }
rust-embed = { version = "8.12.0", features = [
    # "compression",
    "include-exclude",
] }
mimalloc = "0.1.52"
smallvec = { version = "1.15.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.1"
slotmap = { version = "1.1.1", features = ["serde"] }

criterion = "0.8.2"
