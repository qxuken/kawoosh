[workspace]
resolver = "3"
members = ["text-buffer", "doc", "editor", "term", "systems", "lua", "kawoosh", "languages", "web"]
# Patched in below, not a member: lua-src as published, plus the browser.
exclude = ["web/lua-src", "web/alacritty_terminal"]

[workspace.package]
publish = false
version = "0.0.1"
edition = "2024"
authors = ["Nasonov Viktor <me@qxuken.dev>"]
repository = "https://drydock9.qxuken.dev/qxuken/kawoosh"

[workspace.dependencies]
text-buffer = { path = "./text-buffer" }
kawoosh-doc = { path = "./doc" }
kawoosh-editor = { path = "./editor" }
kawoosh-term = { path = "./term" }
kawoosh-systems = { path = "./systems" }
kawoosh-languages = { path = "./languages" }
kawoosh-lua = { path = "./lua" }

# kui at one exact pre-release from the forgejo registry
# (docs/design/kui-requirements.md R1.1). To work against a local checkout
# while a release is in CI, these three lines become
#   kui = { path = "../kui/crates/kui" }  (and the same for -core, -lua).
# By path for now: `caret_solid` (kui F68) and `App::teardown` (kui F74)
# are on kui's main ahead of alpha.16; back to `=0.1.0-alpha.16` from the
# registry once it is tagged.
kui = { path = "../kui/crates/kui" }
kui-core = { path = "../kui/crates/kui-core" }
kui-lua = { path = "../kui/crates/kui-lua" }
# The one Lua in the binary is kui-lua's (kui.md D6).
mlua = { version = "0.12", features = ["lua55", "vendored"] }

log = { version = "0.4.33", features = ["serde"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
crossbeam-channel = "0.5"
tree-sitter = "0.27"
# The grammars (kui.md Decision 13): each behind a feature of
# `kawoosh-languages`, all on by default. Two are git pins — nu and
# go.mod publish no crate that binds through `tree-sitter-language`.
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-css = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-bash = "0.25"
tree-sitter-nu = { git = "https://github.com/nushell/tree-sitter-nu", rev = "4f577aaa735154f934594b598a69ed7b1b707cf6" }
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-sequel = "0.3"
tree-sitter-regex = "0.25"
tree-sitter-diff = "0.1"
tree-sitter-gitcommit = "0.5"
tree-sitter-gomod = { git = "https://github.com/camdencheek/tree-sitter-go-mod", rev = "2e886870578eeba1927a2dc4bd2e2b3f598c5f9a" }
tree-sitter-jsdoc = "0.25"
tree-sitter-md = "0.5"
lsp-types = "0.97"
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = "1"
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

anyhow = { version = "1.0.104", features = ["backtrace"] }
# `Instant` and `SystemTime`: std's own on the desktop, the page's clock
# in a browser, where std's panics (web/README.md).
web-time = "1"
mimalloc = "0.1.52"
smallvec = { version = "1.15.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
slotmap = { version = "1.1.1", features = ["serde"] }

criterion = "0.8.2"

bitflags = { version = "2.13.1", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["as_ref", "deref", "deref_mut"] }

# The browser build (web/README.md): lua-src with a wasm32-unknown-unknown
# arm, which the published one does not have, and alacritty_terminal
# with its pty left out there, which pulls in `polling`.
[patch.crates-io]
lua-src = { path = "./web/lua-src" }
alacritty_terminal = { path = "./web/alacritty_terminal" }

[profile.release]
# Symbols, one codegen unit and fat LTO: 48 MB down to 39 MB. Half of
# what is left is grammar parse tables, which no flag here shrinks.
strip = true
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
