[package]
name = "kawoosh-systems"
publish.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
web-time.workspace = true
kawoosh-doc.workspace = true
text-buffer.workspace = true
memmap2 = "0.9"
crossbeam-channel.workspace = true
log.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
kawoosh-languages.workspace = true
tree-sitter.workspace = true
rusqlite.workspace = true
ignore = "0.4"
# The markdown buffer's images; already in the tree through kui's
# clipboard (arboard), so the formats are all this adds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A browser (web/README.md): a system's loop is a task on the page's
# thread (`Service`), and the alarm is the page's timer.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window"] }
