[package]
name = "kawoosh-systems"
publish.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
kawoosh-doc.workspace = true
text-buffer.workspace = true
memmap2 = "0.9"
crossbeam-channel.workspace = true
log.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
kawoosh-languages.workspace = true
tree-sitter.workspace = true
rusqlite.workspace = true
# A grammar's archive (docs/design/grammars.md): its hash checked, its
# deflated rows inflated — both in the tree already.
blake3.workspace = true
flate2 = "1"
ignore = "0.4"
# The project search (docs/design/search.md Decision 6): the walk above,
# its globs and the pattern — all in the tree already.
globset = "0.4"
regex = "1"
memchr = "2"
# A language server's workspace watched whole (docs/design/lsp-rules.md
# Decision 6): the platform's own events — ReadDirectoryChangesW,
# FSEvents, inotify — where a poll would walk the tree at every beat.
notify = "8"
# The pictures the panes draw (`picture.rs`): the markdown buffer's, a
# preview's, the image pane's. Already in the tree through kui's
# clipboard (arboard), so the formats are all this adds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# An SVG drawn to pixels at the size it is shown at (`picture.rs`).
resvg = "0.48"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The job a language server is put in, so it ends when this process
# does (`job.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
