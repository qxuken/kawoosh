[package]
name = "kawoosh-systems"
publish.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kawoosh-doc.workspace = true
text-buffer.workspace = true
memmap2 = "0.9"
crossbeam-channel.workspace = true
log.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
kawoosh-languages.workspace = true
tree-sitter.workspace = true
rusqlite.workspace = true
# A grammar's archive (docs/design/grammars.md): its hash checked, its
# deflated rows inflated — both in the tree already.
blake3.workspace = true
flate2 = "1"
ignore = "0.4"
# The project search (docs/design/search.md Decision 6): the walk above,
# its globs and the pattern — all in the tree already.
globset = "0.4"
regex = "1"
memchr = "2"
# A language server's workspace watched whole (docs/design/lsp-rules.md
# Decision 6): the platform's own events — ReadDirectoryChangesW,
# FSEvents, inotify — where a poll would walk the tree at every beat.
notify = "8"
# The pictures the panes draw (`picture.rs`): the markdown buffer's, a
# preview's, the image pane's. Already in the tree through kui's
# clipboard (arboard), so the formats are all this adds.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# An SVG drawn to pixels at the size it is shown at (`picture.rs`).
resvg = "0.48"
# The ssh client in-process (docs/design/domains.md Decision 3, amended
# 2026-10-09): one connection a domain, every channel on it — where no
# OpenSSH on Windows can keep a master. Its crypto on `ring`, which
# builds with no CMake or NASM; tokio is in the tree already. 0.58, not
# later: from 0.60 its ML-KEM is RustCrypto's 0.3, whose `kem` 0.3 cannot
# sit beside the pre-release `age` (through `qdot`) holds; and no `rsa`,
# whose release candidates no longer build together (an RSA key is the
# `openssh` client's).
russh = { version = "0.58.0", default-features = false, features = ["ring", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
# A terminal over a channel, behind the pty traits `kawoosh_term` takes.
portable-pty.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The job a language server is put in, so it ends when this process
# does (`job.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
