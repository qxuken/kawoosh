# RustSec advisories against Cargo.lock, taken from kui's own audit workflow.
#
# `cargo audit` reads the lockfile and nothing else: no target dir, no build,
# and no kui checkout either - kui's crates are in Cargo.lock (from the
# crates.io, or without a source while they are taken by path), and
# everything they pull in is there and audited like the rest. It is the one
# check whose result can change without anyone pushing a commit - an advisory
# is published against code that has not moved - which is why this workflow
# has a schedule. A weekly run on main is the part that actually earns its
# keep; the push and pull_request triggers just catch a lockfile change at the
# moment it is made.
#
# It runs with `--deny warnings`, so an unmaintained, unsound or yanked crate
# fails the job the same as a vulnerability does. The escape hatch is
# .cargo/audit.toml: an ignore entry there, with a comment saying what pulls
# the crate in and what would let us delete the line. Without that file
# today's tree is red (ttf-parser, RUSTSEC-2026-0192, through kui), which is
# the intended shape - the ignore list is the record of what we have decided
# to live with.
#
# The yanked half is back since the move to GitHub, as it is in kui: on
# Forgejo's runner it was `--no-yanked`, because one sparse-index request per
# crate (about 500 here) timed out there, and a timed-out lookup is not a
# warning - kui's run 141 printed 175 errors and went green. It completes on
# a hosted runner, as it does on a workstation.
name: audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  schedule:
    # Mondays, 06:00 UTC. The advisory database is the input that moves here,
    # not the repository.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so the cache key below means something and so a run is reproducible
  # from the commit it ran on. The advisory database is fetched fresh every
  # run regardless, so pinning the tool does not pin what it knows about.
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Just the one binary, keyed on the pinned version: a hit turns the
      # install step below into a no-op, a miss costs one `cargo install`.
      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        run: |
          set -eu
          if command -v cargo-audit >/dev/null; then
            cargo audit --version
            exit 0
          fi
          cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}"

      - name: Audit
        run: cargo audit --deny warnings
