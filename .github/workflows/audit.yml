name: Verify release tool pins
on: workflow_dispatch
permissions:
  contents: read
jobs:
  tools:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Check pinned Rust and Nushell
        shell: bash
        run: |
          rustc --version
          nu --version
          test "$(rustc --version | cut -d' ' -f2)" = "$(nu -c 'open rust-toolchain.toml | get toolchain.channel')"
          test "$(nu --version)" = "$(nu -c 'open mise.toml | get tools.nu.version')"
      - name: Check pinned NSIS and its installer plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = makensis /VERSION
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '3\.13') { throw "Unexpected NSIS version $version" }
          $bundle = Join-Path $env:RUNNER_TEMP 'fixture bundle'
          New-Item -ItemType Directory $bundle
          Copy-Item "$env:SystemRoot\System32\where.exe" "$bundle\kawoosh.exe"
          makensis '/DVERSION=0.0.1' "/DBUNDLE=$bundle" "/DOUT=$env:RUNNER_TEMP\setup.exe" packaging/windows/kawoosh.nsi
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP\setup.exe")) { throw "NSIS fixture compilation failed" }
