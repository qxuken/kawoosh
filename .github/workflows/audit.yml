name: Windows import library probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2025
    steps:
      - run: rustup update stable --no-self-update
      - name: Link an exporting executable with the release settings
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP link-probe
          New-Item -ItemType Directory "$work\src" -Force
          @'
          [package]
          name = "kawoosh"
          version = "0.0.1"
          edition = "2024"
          [profile.release]
          strip = true
          lto = "fat"
          codegen-units = 1
          '@ | Set-Content "$work\Cargo.toml"
          @'
          fn main() {}
          #[unsafe(no_mangle)]
          pub extern "C" fn kw_probe() -> u32 { 1 }
          '@ | Set-Content "$work\src\main.rs"
          @'
          fn main() {
              let mut definition = std::path::PathBuf::from(std::env::var_os("OUT_DIR").unwrap());
              definition.push("kawoosh-exports.def");
              std::fs::write(&definition, "EXPORTS\n    kw_probe\n").unwrap();
              println!("cargo:rustc-link-arg-bin=kawoosh=/DEF:{}", definition.display().to_string().replace('\\', "/"));
          }
          '@ | Set-Content "$work\build.rs"
          rustc --version
          cargo build --release --manifest-path "$work\Cargo.toml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Recurse "$work\target\release" -File |
            Where-Object { $_.Name -match 'kawoosh|\.lib$' } |
            Select-Object FullName,Length | Format-List
          if (!(Test-Path "$work\target\release\deps\kawoosh.lib")) {
            throw "The packaging script cannot find target/release/deps/kawoosh.lib"
          }
